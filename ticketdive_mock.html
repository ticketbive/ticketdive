<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チケット一覧 | TicketDive</title>
<style>
  * { box-sizing: border-box; }
  body, html { margin: 0; max-width: 100vw; font-size: 10px; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, Meiryo, sans-serif; -webkit-font-smoothing: antialiased; color: #4f4745; }
  :root { --b1:#4f4745; --b2:#4f4745; --b3:#919191; --w1:#fff; --w3:#f7f7f7; --primary:#5ab9ff; }
  a { text-decoration: none; color: inherit; }

  .banner { display: block; padding: 12px 16px; background: #e5e5e5; color: #484848; font-size: 14px; font-weight: 600; line-height: 1.5; text-align: center; }

  .wrap { max-width: 48rem; margin: 0 auto; padding: 0 2rem 8rem; }

  .hero { width: 100%; height: 18rem; background: #f7f7f7; overflow: hidden; position: relative; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }

  .head { font-family: "Bebas Neue", "Hiragino Sans", sans-serif; font-size: 4rem; font-weight: 400; letter-spacing: .1rem; margin: 2.4rem 0 1.2rem; }

  .tabs { display: flex; gap: 2.4rem; border-bottom: 1px solid #efefef; margin-bottom: 3.2rem; }
  .tab { font-size: 1.5rem; font-weight: 600; padding: 1.2rem 0; color: var(--b3); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--b1); border-bottom-color: var(--b1); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3.2rem 2.2rem; }

  .card { display: block; border-radius: 4px; overflow: hidden; cursor: pointer; }
  .card:hover .thumb img { transform: scale(1.1); }

  .thumb { position: relative; width: 100%; aspect-ratio: 1/1; background: var(--w3); border-radius: 4px; overflow: hidden; padding: 1.2rem; display: flex; align-items: center; justify-content: center; }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .3s ease-in-out; filter: drop-shadow(0 0 12px rgba(0,0,0,.4)); }

  .date { display: block; font-size: 1.2rem; font-weight: 600; color: var(--b3); margin: 1.6rem 0 .8rem; }
  .title { display: block; font-size: 1.4rem; font-weight: 600; line-height: 150%; color: var(--b1); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .meta { display: flex; justify-content: space-between; margin-top: .8rem; }
  .type, .count { font-size: 1.2rem; font-weight: 600; color: var(--primary); }

  .empty { font-size: 1.4rem; color: var(--b3); line-height: 1.8; padding: 4rem 0; text-align: center; }
  .empty a { color: var(--primary); font-weight: 600; }

  .back { display: block; margin: 4.8rem auto 0; width: 24rem; height: 4.6rem; line-height: 4.6rem; border-radius: 2.3rem; border: 2px solid var(--primary); color: var(--primary); font-size: 1.5rem; font-weight: 700; text-align: center; }

  .foot { text-align: center; font-size: 1.1rem; color: #999; padding: 4rem 0 2rem; }
</style>
</head>
<body>

<a class="banner" href="#">【重要なお知らせ】メールアドレス変更・分配の仕様変更につきまして</a>

<div class="hero"><img id="heroImg" alt="fv" src=""></div>

<div class="wrap">
  <div class="head">Tickets</div>

  <div class="tabs">
    <span class="tab on">これから</span>
    <span class="tab">すべて</span>
  </div>

  <div class="grid" id="grid"></div>

  <a class="back" href="index_ticketdive.html">券面を登録する</a>

  <div class="foot">TicketDive Mock</div>
</div>

<script>
(function () {
  var DETAIL_PAGE = './detail.html';
  var STATE_KEY = 'td_clone_state_v3';
  var KEYS = ["userInput","userName","userGroup","eventTitle","eventDate",
              "eventShowtime","eventImage","eventVenue","eventTicketType","eventUrl"];

  function g(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  }); }

  function parseDate(raw) {
    var m = raw.match(/(\d{4})年(\d{1,2})月(\d{1,2})日\(([^)]+)\)/);
    return m ? { mmdd: Number(m[2]) + '.' + Number(m[3]), dow: m[4] } : { mmdd: '', dow: '' };
  }
  function parseTimes(raw) {
    var o = raw.match(/開場\s*(\d{1,2}:\d{2})/);
    var s = raw.match(/開演\s*(\d{1,2}:\d{2})/);
    return { open: o ? o[1] : '', start: s ? s[1] : '' };
  }

  function buildState() {
    var d = parseDate(g('eventDate'));
    var t = parseTimes(g('eventShowtime'));
    return {
      title: g('eventTitle'),
      venue: g('eventVenue'),
      date: d.mmdd,
      dow: d.dow,
      open: t.open,
      start: t.start,
      ticketType: g('eventTicketType'),
      name: g('userName'),
      kind: g('userGroup'),
      seat: g('userInput'),
      bgRotateDeg: '60',
      qrData: null,
      posterData: g('eventImage'),
      part: '',
      colorTheme: 'green',
      entered: false,
      enteredTime: null
    };
  }

  function writeState() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(buildState())); } catch (e) {}
    try { sessionStorage.setItem('td_password_gate_unlocked_v1', '1'); } catch (e) {}
    try {
      localStorage.removeItem('ticketEnteredAt');
      localStorage.removeItem('ticketColorOverride');
      localStorage.removeItem('ticketReferenceOverride');
    } catch (e) {}
  }

  function render() {
    var title = g('eventTitle');
    var img = g('eventImage');
    var grid = document.getElementById('grid');
    var hero = document.getElementById('heroImg');

    if (img) hero.src = img; else hero.style.display = 'none';

    if (!title) {
      grid.outerHTML = '<div class="empty">まだ券面が登録されていません。<br><a href="index_ticketdive.html">券面を登録する</a></div>';
      return;
    }

    var d = parseDate(g('eventDate'));
    var t = parseTimes(g('eventShowtime'));
    var line = d.mmdd + (t.start ? ' ' + t.start : '');

    var card = document.createElement('a');
    card.className = 'card';
    card.href = DETAIL_PAGE;
    card.innerHTML =
      '<div class="thumb">' + (img ? '<img src="' + esc(img) + '" alt="fv画像">' : '') + '</div>' +
      '<span class="date">' + esc(line || '日時未設定') + '</span>' +
      '<span class="title">' + esc(title) + '</span>' +
      '<div class="meta"><span class="type">' + esc(g('eventTicketType') || '—') + '</span>' +
      '<span class="count">1枚</span></div>';

    card.addEventListener('click', writeState);
    grid.appendChild(card);
  }

  document.addEventListener('DOMContentLoaded', render);
  window.addEventListener('pageshow', render);
})();
</script>

<script>
/* 共有リンク(#share=)取り込み */
(function () {
  var KEYS = ["userInput","userName","userGroup","eventTitle","eventDate","eventShowtime","eventImage","eventVenue","eventTicketType","eventUrl"];
  var m = location.hash.match(/^#share=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  try {
    var bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var data = JSON.parse(new TextDecoder().decode(bytes));
    Object.keys(data).forEach(function (k) {
      if (KEYS.indexOf(k) !== -1) localStorage.setItem(k, data[k]);
    });
    localStorage.removeItem('ticketEnteredAt');
    localStorage.removeItem('ticketColorOverride');
    localStorage.removeItem('ticketReferenceOverride');
    history.replaceState(null, '', location.pathname);
    window.addEventListener('DOMContentLoaded', function () { location.reload(); });
  } catch (e) {}
})();
</script>

</body>
</html>
